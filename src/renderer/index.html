<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' data:; media-src pet-audio:" />
    <title>Study Companion Pet</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="data-views.css" />
  </head>
  <body>
    <section id="panel" class="frame" data-hit hidden>
    </section>

    <div id="pet-area">
      <div id="pet-unit">
        <div id="bubble" data-hit></div>
        <!-- the dock beside her (src/ui/dock) is mounted in here, next to the canvas -->
        <div id="pet-body">
          <canvas id="pet" data-hit tabindex="0" role="button"></canvas>
        </div>
      </div>
    </div>
    <div id="tooltip" role="tooltip" hidden></div>
    <script src="renderer.js"></script>
  </body>
</html>

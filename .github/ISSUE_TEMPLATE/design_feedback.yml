name: Design feedback
description: Tell me what you expected the pet to do.
title: "[design] "
labels: ["design", "feedback wanted", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. This is the most useful kind of issue right now: not "it crashed" but "I expected the pet to do X and it did Y".
  - type: textarea
    id: trying
    attributes:
      label: What were you doing?
      description: Studying, coding with an agent, a deadline... a sentence or two.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect the pet to do or say?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What did it do instead?
  - type: dropdown
    id: daily
    attributes:
      label: Would you keep it on screen all day if it worked the way you expect?
      options:
        - "Yes"
        - "Maybe"
        - "No"
    validations:
      required: true

name: Feature request
description: Something the pet or the panel should be able to do.
title: "[feature] "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, and when it comes up.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to build this?
      options:
        - "Yes, with some pointers"
        - "Maybe"
        - "No"

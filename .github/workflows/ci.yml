name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  commits:
    # A commit names the people who made it. AI tools are not listed as
    # co-authors; see CONTRIBUTING.md. AI tools are matched by their e-mail
    # address (scripts/ai-trailers.txt), so people named Claude or Jules stay.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh scripts/check-commit-trailers.sh "origin/${{ github.base_ref }}..HEAD"
